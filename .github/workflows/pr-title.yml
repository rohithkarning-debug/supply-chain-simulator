name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^(feat|fix|test|docs|ci|chore)(\(.+\))?:\ .+ ]]; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title must start with feat:, fix:, test:, docs:, ci: or chore: (got: $TITLE)"
            exit 1
          fi